<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Чек лист – Хижар, затваряне на смяна</title>
<style>
  :root {
    --bg: #faf9f6;
    --card: #ffffff;
    --border: #ddd8cc;
    --text: #2c2c2a;
    --text-secondary: #5f5e5a;
    --text-muted: #888780;
    --accent: #0f6e56;
    --accent-bg: #e1f5ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 16px 60px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    max-width: 640px;
    margin-left: auto;
    margin-right: auto;
  }
  .org { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 2px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 2px; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .02em; }
  .subtitle { color: var(--text-secondary); font-size: 14px; margin: 0 0 18px; font-weight: 600; text-transform: uppercase; }
  .range { font-size: 13px; color: var(--text-secondary); text-transform: none; font-weight: 600; margin: 0 0 8px; }

  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 22px; }
  .day {
    font-family: inherit;
    padding: 7px 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text-muted);
    text-align: center;
    line-height: 1.25;
  }
  .day .wd { display: block; font-size: 11px; text-transform: uppercase; }
  .day .dm { display: block; font-size: 14px; font-weight: 600; }
  .day.has { color: var(--accent); border-color: var(--accent); cursor: pointer; }
  .day.has:hover { background: var(--accent-bg); }
  .day.has.selected { background: var(--accent); color: #fff; }
  .day:disabled { cursor: default; opacity: .55; }

  .hint { color: var(--text-muted); font-size: 14px; }
  .view-head { border-top: 2px solid var(--border); padding-top: 14px; margin-bottom: 4px; }
  .view-head h2 { font-size: 17px; text-transform: none; margin-bottom: 2px; }
  .meta { font-size: 13px; color: var(--text-secondary); margin: 0; }
  .progress {
    display: inline-block;
    margin-top: 8px;
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-bg);
    padding: 2px 10px;
    border-radius: 10px;
  }
  .progress.done { background: var(--accent); color: #fff; }
  section { margin: 20px 0 0; }
  .row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    border-top: 1px solid var(--border);
    font-size: 14.5px;
  }
  .box {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    margin-top: 2px;
    border: 1.5px solid var(--border);
    border-radius: 4px;
    background: var(--card);
    color: #fff;
    font-size: 14px;
    line-height: 17px;
    text-align: center;
  }
  .row.on .box { background: var(--accent); border-color: var(--accent); }
  .row.on .text { color: var(--text-muted); }
  .photos { padding: 0 0 10px 30px; display: flex; flex-wrap: wrap; gap: 8px; }
  .photo { width: 96px; height: 96px; }
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: zoom-in;
    display: block;
  }
  .photo.big { width: 100%; height: auto; }
  .photo.big img { height: auto; object-fit: contain; cursor: zoom-out; }
  .notes { margin-top: 22px; border-top: 2px solid var(--border); padding-top: 10px; }
  .notes .label { font-size: 13px; color: var(--text-secondary); margin: 0 0 2px; }
  .notes .value { margin: 0; white-space: pre-wrap; font-size: 15px; }
  @media (max-width: 380px) { .day .dm { font-size: 12.5px; } }
</style>
</head>
<body>

<p class="org">Хижа KUKER</p>
<h1>Чек лист – Хижар</h1>
<p class="subtitle">Затваряне на смяна</p>

<h2 class="range">Последни 2 седмици</h2>
<div class="days" id="days"></div>

<div id="view"><p class="hint">Избери дата, за да видиш попълнения чек лист.</p></div>

<script src="/kuker/zatvaryane/sections.js"></script>
<script>
const API = '/kuker/api';
const pad2 = n => String(n).padStart(2, '0');
const toIso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const fromIso = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const dmy = iso => { const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; };

const daysEl = document.getElementById('days');
const viewEl = document.getElementById('view');
let available = new Set();
let selected = '';

function lastTwoWeeks() {
  const out = [];
  const today = new Date();
  for (let i = 0; i < 14; i++) {
    out.push(toIso(new Date(today.getFullYear(), today.getMonth(), today.getDate() - i)));
  }
  return out.reverse();
}

function renderDays() {
  daysEl.innerHTML = '';
  lastTwoWeeks().forEach(iso => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'day' + (available.has(iso) ? ' has' : '') + (iso === selected ? ' selected' : '');
    const wd = document.createElement('span');
    wd.className = 'wd';
    wd.textContent = fromIso(iso).toLocaleDateString('bg-BG', { weekday: 'short' });
    const dm = document.createElement('span');
    dm.className = 'dm';
    dm.textContent = `${iso.slice(8, 10)}.${iso.slice(5, 7)}`;
    btn.append(wd, dm);
    if (available.has(iso)) {
      btn.addEventListener('click', () => select(iso));
    } else {
      btn.disabled = true;
      btn.title = 'Няма попълнен чек лист';
    }
    daysEl.appendChild(btn);
  });
}

function el(tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderChecklist(iso, data) {
  viewEl.innerHTML = '';
  const record = data.record;
  const photos = data.photos || {};
  if (!record) {
    viewEl.appendChild(el('p', 'hint', 'Няма попълнен чек лист за тази дата.'));
    return;
  }

  const total = SECTIONS.reduce((n, s) => n + s.checks.length, 0);
  const done = SECTIONS.reduce((n, s) => n + s.checks.filter(c => record.checks && record.checks[c.id]).length, 0);

  const head = el('div', 'view-head');
  const weekday = fromIso(iso).toLocaleDateString('bg-BG', { weekday: 'long' });
  head.appendChild(el('h2', '', `${dmy(iso)} · ${weekday}`));
  const parts = [];
  if (record.name) parts.push(`Служител: ${record.name}`);
  if (record.start) parts.push(`започване ${record.start}`);
  if (record.end) parts.push(`приключване ${record.end}`);
  head.appendChild(el('p', 'meta', parts.join(' · ')));
  head.appendChild(el('span', 'progress' + (done === total ? ' done' : ''), `${done} / ${total} изпълнени`));
  viewEl.appendChild(head);

  SECTIONS.forEach(sec => {
    const wrap = document.createElement('section');
    wrap.appendChild(el('h2', '', sec.title));
    sec.checks.forEach(item => {
      const on = !!(record.checks && record.checks[item.id]);
      const row = el('div', 'row' + (on ? ' on' : ''));
      row.appendChild(el('span', 'box', on ? '✓' : ''));
      row.appendChild(el('span', 'text', item.text));
      wrap.appendChild(row);

      const ids = photos[item.id] || [];
      if (item.photo && ids.length) {
        const strip = el('div', 'photos');
        ids.forEach(id => {
          const box = el('div', 'photo');
          const img = document.createElement('img');
          img.src = `${API}/zphoto?id=${encodeURIComponent(id)}`;
          img.alt = 'Снимка';
          img.addEventListener('click', () => box.classList.toggle('big'));
          box.appendChild(img);
          strip.appendChild(box);
        });
        wrap.appendChild(strip);
      }
    });
    viewEl.appendChild(wrap);
  });

  const notes = el('div', 'notes');
  notes.appendChild(el('p', 'label', 'Забележки'));
  notes.appendChild(el('p', 'value', record.notes || '—'));
  viewEl.appendChild(notes);
}

async function select(iso) {
  selected = iso;
  renderDays();
  try { history.replaceState(null, '', `#${iso}`); } catch (e) {}
  viewEl.innerHTML = '';
  viewEl.appendChild(el('p', 'hint', 'Зарежда се…'));
  try {
    const res = await fetch(`${API}/zrec?date=${iso}`, { cache: 'no-store' });
    if (!res.ok) throw new Error('load failed');
    if (selected === iso) renderChecklist(iso, await res.json());
  } catch (e) {
    if (selected === iso) {
      viewEl.innerHTML = '';
      viewEl.appendChild(el('p', 'hint', 'Чек листът не може да бъде зареден. Опитай пак.'));
    }
  }
}

(async function init() {
  try {
    const res = await fetch(`${API}/zdates`, { cache: 'no-store' });
    if (res.ok) available = new Set((await res.json()).dates || []);
  } catch (e) {}
  renderDays();
  const hash = location.hash.slice(1);
  if (/^\d{4}-\d{2}-\d{2}$/.test(hash)) select(hash);
})();
</script>
</body>
</html>
