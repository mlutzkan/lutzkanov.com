<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Чек лист – Хижар, затваряне на смяна</title>
<style>
  :root {
    --bg: #faf9f6;
    --card: #ffffff;
    --border: #ddd8cc;
    --text: #2c2c2a;
    --text-secondary: #5f5e5a;
    --text-muted: #888780;
    --accent: #0f6e56;
    --accent-bg: #e1f5ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 16px 60px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    max-width: 640px;
    margin-left: auto;
    margin-right: auto;
  }
  .org { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 2px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 2px; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .02em; }
  .subtitle { color: var(--text-secondary); font-size: 14px; margin: 0 0 16px; font-weight: 600; text-transform: uppercase; }
  .header-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #progress {
    font-size: 12px; color: var(--accent);
    background: var(--accent-bg); padding: 2px 10px; border-radius: 10px;
    white-space: nowrap;
  }
  #progress.done { background: var(--accent); color: #fff; }
  input[type=text], input[type=time], input[type=date] {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
  }
  input[type=text]:focus, input[type=time]:focus, input[type=date]:focus { outline: none; border-color: var(--accent); }
  .date-wrap { position: relative; display: flex; gap: 8px; }
  #date-btn {
    flex-shrink: 0;
    font-size: 18px;
    line-height: 1;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    cursor: pointer;
  }
  #f-date-picker {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 44px;
    height: 100%;
    opacity: 0;
    pointer-events: none;
  }
  .field { margin-top: 10px; }
  .field label { font-size: 13px; color: var(--text-secondary); display: block; margin-bottom: 4px; }
  section { margin-bottom: 24px; }
  .top-block { margin-bottom: 22px; }
  label.check-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 0;
    border-top: 1px solid var(--border);
    cursor: pointer;
  }
  label.check-row input {
    margin-top: 3px;
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
  }
  label.check-row span { font-size: 14.5px; }
  label.check-row input:checked + span { color: var(--text-muted); }
  .final-block { border-top: 2px solid var(--border); margin-top: 8px; padding-top: 6px; }
  #reset-btn {
    font-size: 13px;
    color: var(--text-secondary);
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .actions { display: flex; align-items: center; gap: 10px; margin-top: 24px; }
  #save-btn {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 10px 22px;
    cursor: pointer;
  }
  #save-status { font-size: 13px; color: var(--accent); flex: 1; }
  #reset-btn { margin-left: auto; }
  @media print {
    body { padding: 0; }
    .actions, #progress, #date-btn { display: none; }
  }
</style>
</head>
<body>

<div class="header-row">
  <div>
    <p class="org">Хижа KUKER</p>
    <h1>Чек лист – Хижар</h1>
  </div>
  <span id="progress"></span>
</div>
<p class="subtitle">Затваряне на смяна</p>

<div class="top-block">
  <div class="field">
    <label for="f-date">Дата</label>
    <div class="date-wrap">
      <input type="text" id="f-date" inputmode="numeric" placeholder="дд/мм/гггг" maxlength="10" autocomplete="off">
      <button type="button" id="date-btn" aria-label="Избери дата от календар">&#128197;</button>
      <input type="date" id="f-date-picker" tabindex="-1" aria-hidden="true">
    </div>
  </div>
  <div class="field">
    <label for="f-name">Име на служител</label>
    <input type="text" id="f-name" value="Марто">
  </div>
  <div class="field">
    <label for="f-start">Час на започване на проверката</label>
    <input type="text" id="f-start" inputmode="numeric" placeholder="чч:мм" maxlength="5" autocomplete="off">
  </div>
</div>

<div id="sections"></div>

<div class="final-block">
  <div class="field">
    <label for="f-end">Час на приключване</label>
    <input type="text" id="f-end" inputmode="numeric" placeholder="чч:мм" maxlength="5" autocomplete="off">
  </div>
  <div class="field">
    <label for="f-sign">Подпис на хижаря</label>
    <input type="text" id="f-sign">
  </div>
  <div class="field">
    <label for="f-checked">Проверил отговорник</label>
    <input type="text" id="f-checked">
  </div>
</div>

<div class="actions">
  <button id="save-btn" type="button">Запази</button>
  <span id="save-status"></span>
  <button id="reset-btn" type="button">Изчисти всичко</button>
</div>

<script>
const SECTIONS = [
  {
    title: "1. Камина и отопление",
    checks: [
      "Провери състоянието на камината преди затваряне.",
      "Не добавяй дърва, ако обектът ще се затваря и огънят трябва да изгасне.",
      "Увери се, че камината е оставена в безопасно състояние съгласно инструкциите за експлоатация.",
      "Провери отоплителните уреди и ги изключи",
      "Провери дали няма необичайна миризма, дим или признаци на прегряване."
    ]
  },
  {
    title: "2. Музика и електрическо оборудване",
    checks: [
      "Изключи музиката в салона.",
      "Изключи озвучаването и свързаните устройства според инструкциите.",
      "Изключи ненужните електрически уреди.",
      "Провери дали няма оставени включени уреди, които не трябва да работят след затваряне.",
      "Провери осветлението и изключи ненужните лампи.",
      "Увери се, че няма видими повреди по кабели, контакти или уреди."
    ]
  },
  {
    title: "4. Проверка за чистота",
    checks: [
      "Провери чистотата на салона.",
      "Провери дали няма оставена посуда или отпадъци.",
      "Провери чистотата на верандата и външните зони.",
      "Увери се, че няма оставени чаши, чинии или други вещи на външните маси.",
      "Провери чистотата на тоалетните.",
      "Провери дали всички кранове са затворени.",
      "Провери дали няма течове или преливащи тоалетни.",
      "Увери се, че проходите и входът са свободни от препятствия.",
      "Докладвай всички установени пропуски или замърсявания."
    ]
  },
  {
    title: "5. Обща проверка на обекта",
    checks: [
      "Провери всички помещения за забравени вещи, оставени съдове или отпадъци.",
      "Провери прозорците и външните врати.",
      "Затвори прозорците, когато това е необходимо.",
      "Увери се, че входните врати са затворени и заключени според процедурата.",
      "Провери дали няма видими течове или други технически проблеми.",
      "Провери дали няма необичайни миризми, дим или шумове.",
      "Увери се, че външните зони са обезопасени.",
      "Изключи осветлението в помещенията, които не трябва да остават осветени.",
      "Активирай охранителната система, ако има такава и това е част от задълженията ти."
    ]
  },
  {
    title: "6. Финална проверка преди напускане",
    checks: [
      "Камината е проверена и оставена в безопасно състояние.",
      "Отоплението е проверено.",
      "Няма течаща вода или видими течове.",
      "Музиката и ненужното оборудване са изключени.",
      "Всички помещения са проверени.",
      "Прозорците и вратите са проверени.",
      "Обектът е заключен съгласно установената процедура.",
      "Всички проблеми са докладвани на отговорника."
    ]
  }
];

const container = document.getElementById('sections');
let checkCount = 0;
SECTIONS.forEach(sec => {
  const wrap = document.createElement('section');
  const h = document.createElement('h2');
  h.textContent = sec.title;
  wrap.appendChild(h);
  sec.checks.forEach(text => {
    const label = document.createElement('label');
    label.className = 'check-row';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.id = 'c' + (++checkCount);
    const span = document.createElement('span');
    span.textContent = text;
    label.appendChild(input);
    label.appendChild(span);
    wrap.appendChild(label);
  });
  container.appendChild(wrap);
});

const STORAGE_KEY = 'kuker-zatvaryane-smyana';

function collectState() {
  const state = {};
  document.querySelectorAll('input[type=checkbox]').forEach(el => state[el.id] = el.checked);
  document.querySelectorAll('input[type=text], input[type=time]').forEach(el => state[el.id] = el.value);
  return state;
}

const pad2 = n => String(n).padStart(2, '0');
const formatDate = d => `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}`;
const todayLocal = () => formatDate(new Date());
const nowTime = () => { const d = new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const DEFAULT_NAME = 'Марто';

function dmyToIso(text) {
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(text.trim());
  return m ? `${m[3]}-${pad2(m[2])}-${pad2(m[1])}` : '';
}

const datePicker = document.getElementById('f-date-picker');
document.getElementById('date-btn').addEventListener('click', () => {
  datePicker.value = dmyToIso(document.getElementById('f-date').value) || '';
  try { datePicker.showPicker(); } catch (e) { datePicker.focus(); datePicker.click(); }
});
datePicker.addEventListener('change', () => {
  if (!datePicker.value) return;
  const [y, m, d] = datePicker.value.split('-');
  document.getElementById('f-date').value = `${d}/${m}/${y}`;
  save();
});

function applyState(state) {
  Object.keys(state || {}).forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    if (el.type === 'checkbox') el.checked = !!state[id];
    else el.value = state[id] || '';
  });
}

function updateProgress() {
  const boxes = document.querySelectorAll('input[type=checkbox]');
  const done = [...boxes].filter(b => b.checked).length;
  const p = document.getElementById('progress');
  p.textContent = `${done} / ${boxes.length}`;
  p.classList.toggle('done', done === boxes.length);
}

function save() {
  updateProgress();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(collectState())); } catch (e) {}
}

document.addEventListener('input', save);
document.addEventListener('change', save);

document.getElementById('reset-btn').addEventListener('click', () => {
  if (!window.confirm('Да изчистя ли всички отметки и полета?')) return;
  document.querySelectorAll('input[type=checkbox]').forEach(el => el.checked = false);
  document.querySelectorAll('input[type=text], input[type=time]').forEach(el => el.value = '');
  document.getElementById('f-date').value = todayLocal();
  document.getElementById('f-name').value = DEFAULT_NAME;
  document.getElementById('f-start').value = nowTime();
  save();
});

document.getElementById('save-btn').addEventListener('click', () => {
  document.getElementById('f-end').value = nowTime();
  save();
  const status = document.getElementById('save-status');
  status.textContent = `Записано в ${document.getElementById('f-end').value}`;
  clearTimeout(status._t);
  status._t = setTimeout(() => { status.textContent = ''; }, 3000);
});

try {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) applyState(JSON.parse(saved));
} catch (e) {}
document.getElementById('f-date').value = todayLocal();
document.getElementById('f-start').value = nowTime();
updateProgress();
</script>
</body>
</html>
